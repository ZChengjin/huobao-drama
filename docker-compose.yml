# 火宝短剧 Docker 一体化部署：应用 + Watchtower（自动拉新镜像重建容器，支撑应用内一键更新）
#
# 使用：
#   1. 复制 .env.example 为 .env 并修改 WATCHTOWER_TOKEN（两端必须一致）
#   2. docker compose up -d
#   3. 访问 http://localhost:5679 ，设置页「关于更新」可检查/一键更新
#
# 数据持久化在命名卷 huobao-data（SQLite + 生成的图片/视频 + 可在线编辑的 workspace/skills）。

services:
  app:
    image: huobao/huobao-drama:latest
    build:
      context: .
      args:
        # 构建时注入版本号（发布镜像时务必指定，如 HUOBAO_VERSION=1.2.0）
        HUOBAO_VERSION: ${HUOBAO_VERSION:-dev}
    ports:
      - "5679:5679"
    environment:
      # 配置后设置页「关于更新」出现「立即更新」按钮；删除这两行则退化为手动更新提示
      HUOBAO_WATCHTOWER_URL: http://watchtower:8080
      HUOBAO_WATCHTOWER_TOKEN: ${WATCHTOWER_TOKEN:-please-change-me}
      # 发布清单（默认 GitHub Releases latest.json，与桌面版同一份）
      # HUOBAO_UPDATE_FEED: https://github.com/chatfire-AI/huobao-drama/releases/latest/download/latest.json
    volumes:
      - huobao-data:/app/data
    labels:
      # Watchtower --label-enable：只更新显式标记的容器
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped

  # 本机源码热更新：docker compose --profile dev up --build dev
  # 源码文件实时挂载；backend 用 tsx watch，frontend 用 Nuxt dev server。
  dev:
    profiles: ["dev"]
    image: huobao/huobao-drama-dev:local
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "5679:5679"
      - "3013:3013"
    environment:
      PORT: 5679
      SQLITE_PATH: /app/data/huobao.sqlite3
      HUOBAO_DATA_DIR: /app/data
      WORKSPACE_PATH: /app/data/workspace
      NUXT_API_PROXY: http://127.0.0.1:5679
      NUXT_WATCH_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/workspace
      - huobao-data:/app/data
      - dev-backend-node-modules:/workspace/backend/node_modules
      - dev-frontend-node-modules:/workspace/frontend/node_modules
      - dev-frontend-nuxt:/workspace/frontend/.nuxt
      - dev-frontend-output:/workspace/frontend/.output
    command: ["sh", "/workspace/docker/dev-entrypoint.sh"]
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:latest
    command: >
      --http-api-update
      --http-api-token ${WATCHTOWER_TOKEN:-please-change-me}
      --label-enable
      --cleanup
      --rolling-restart
      --interval 86400
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  huobao-data:
  dev-backend-node-modules:
  dev-frontend-node-modules:
  dev-frontend-nuxt:
  dev-frontend-output:
